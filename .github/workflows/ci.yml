name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test tests/Troubleshootr.Tests -c Release --no-build
      # Real collectors on a clean Windows Server machine: must finish and print a report.
      - run: src/Troubleshootr.Cli/bin/Release/net472/troubleshootr-cli.exe scan --full --timings
        shell: bash
        continue-on-error: true
      # Exit code 1 means "found a Critical problem", which is a normal result; anything else is a crash or bad usage.
      - run: src/Troubleshootr.Cli/bin/Release/net472/troubleshootr-cli.exe scan --full --json --out scan.json || [ $? -eq 1 ]; test -s scan.json
        shell: bash
