name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test tests/Troubleshootr.Tests -c Release --no-build
      # Real collectors on a clean Windows Server machine: must finish and print a report.
      - run: src/Troubleshootr.Cli/bin/Release/net472/troubleshootr.exe scan --full --timings
        shell: bash
        continue-on-error: true
      - run: src/Troubleshootr.Cli/bin/Release/net472/troubleshootr.exe scan --full --json --out scan.json; test -s scan.json
        shell: bash
